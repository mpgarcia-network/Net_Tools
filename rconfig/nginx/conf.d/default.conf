# =============================================================================
# Nginx reverse proxy para o rConfig V8 Core (stack rconfig).
# Renderizado no host e montado (ro) em /etc/nginx/conf.d/default.conf.
# Portas publicadas pelo serviço 'nginx' no host:
#   HTTP  -> ${RCONFIG_HTTP_PORT}  (padrão 8088)
#   HTTPS -> ${RCONFIG_HTTPS_PORT} (padrão 8443)
# Se alterar RCONFIG_HTTPS_PORT no .env, ajuste o redirect abaixo (8443).
# =============================================================================

# HTTP -> HTTPS (mantém a porta HTTPS dedicada)
server {
    listen 80;
    server_name _;

    return 301 https://$host:8443$request_uri;
}

# Servidor HTTPS (listen 443 no container / porta publicada no host)
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/rconfig.crt;
    ssl_certificate_key /etc/nginx/ssl/rconfig.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Converte automaticamente assets (CSS/JS/imagens) HTTP -> HTTPS no navegador
    add_header Content-Security-Policy "upgrade-insecure-requests" always;

    location / {
        # Encaminha para o Apache do rConfig (serviço 'app' na rede overlay)
        proxy_pass http://app:80;

        # Preserva o Host/porta de origem (LAN, Tailscale, etc.)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-Host $http_host;

        # Mantém redirects do Laravel em HTTPS
        proxy_redirect http:// https://;
        proxy_redirect default;

        # Uploads de config/backups grandes
        client_max_body_size 100M;
    }
}
