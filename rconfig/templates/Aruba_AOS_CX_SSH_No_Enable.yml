# rConfig connection template
## Edition: custom
## Status: community-tested pattern adapted for Aruba AOS-CX
## Docs: https://docs.rconfig.com/device-management/connection-templates/
## Note: all free-text values must be wrapped in double quotes " "

main:
  name: "Aruba AOS-CX - SSH - No Enable"
  desc: "Aruba AOS-CX SSH based connection without enable mode."

connect:
  timeout: 5
  protocol: ssh
  port: 22

auth:
  username: "login as:"
  password: "Password:"
  enable: off
  enableCmd: "enable"
  enablePassPrmpt: "Password:"
  hpAnyKeyStatus: off
  hpAnyKeyPrmpt: "Press any key to continue"

config:
  linebreak: "n"
  paging: on
  pagingCmd: "no page"
  resetPagingCmd: "page"
  saveConfig: "write memory"
  exitCmd: "exit"
