version: '3.8'

# =============================================================================
# Net Tools - gestao de configuracao de rede (Netmiko) com push, dry-run,
# aprovacao, agendamento, auditoria e backup/versionamento. Swarm, 1 replica.
# A imagem e construida localmente pelo manager-docker.sh.
# =============================================================================

services:
  app:
    image: nettools:local
    hostname: nettools
    ports:
      - "${APP_PORT:-8090}:8000"
    environment:
      - APP_NAME=${APP_NAME:-Net Tools}
      - BRAND_LOGIN=${BRAND_LOGIN:-}
      - BRAND_APP=${BRAND_APP:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SESSION_MAX_AGE=${SESSION_MAX_AGE:-43200}
      - SESSION_HTTPS_ONLY=${SESSION_HTTPS_ONLY:-false}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - REQUIRE_APPROVAL=${REQUIRE_APPROVAL:-true}
      - TIMEZONE=${TIMEZONE:-America/Sao_Paulo}
      - NETMIKO_MAX_WORKERS=${NETMIKO_MAX_WORKERS:-10}
      - NETMIKO_CONN_TIMEOUT=${NETMIKO_CONN_TIMEOUT:-30}
      # Integracao (conectores opcionais)
      - LIBRENMS_URL=${LIBRENMS_URL:-}
      - LIBRENMS_TOKEN=${LIBRENMS_TOKEN:-}
      - RCONFIG_URL=${RCONFIG_URL:-}
      - RCONFIG_TOKEN=${RCONFIG_TOKEN:-}
      - RCONFIG_VERIFY_TLS=${RCONFIG_VERIFY_TLS:-true}
    volumes:
      - data:/data
    networks:
      - nettools-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - "node.hostname == ${SWARM_NODE_CONSTRAINT:-}"

volumes:
  data:

networks:
  nettools-net:
    external: true  # Criada pelo manager-docker.sh (overlay com subnet dedicada)
